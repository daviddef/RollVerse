<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Rollverse app icon, bold variant">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ff3d63"/>
    </linearGradient>
    <radialGradient id="hub2" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#f2ffcf"/>
      <stop offset="1" stop-color="#c6ff42"/>
    </radialGradient>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#3a0d16" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg2)"/>

  <!-- big legible wheel/bearing -->
  <g filter="url(#soft2)">
    <circle cx="512" cy="486" r="300" fill="#2b1c50"/>
    <circle cx="512" cy="486" r="300" fill="none" stroke="#ffffff22" stroke-width="14"/>
    <circle cx="512" cy="486" r="168" fill="url(#hub2)"/>
    <circle cx="512" cy="486" r="52" fill="#2b1c50"/>
    <!-- bearing balls -->
    <g fill="#37d6e6">
      <circle cx="512" cy="404" r="18"/>
      <circle cx="583" cy="527" r="18"/>
      <circle cx="441" cy="527" r="18"/>
    </g>
  </g>

  <!-- single confident motion swoosh -->
  <path d="M150 828 q 200 -84 400 -50 q 180 30 324 -66" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
</svg>
