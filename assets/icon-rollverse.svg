<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Rollverse app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1c50"/>
      <stop offset="0.55" stop-color="#3c2757"/>
      <stop offset="1" stop-color="#5a3560"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#e6ffa8"/>
      <stop offset="1" stop-color="#c6ff42"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- squircle background (iOS masks corners; keep art safe inside) -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- ambient dusk glow -->
  <circle cx="512" cy="470" r="360" fill="#ff5c39" opacity="0.10"/>

  <!-- orbit ring (the "-verse": a world of parks) -->
  <g transform="rotate(-24 512 512)">
    <ellipse cx="512" cy="512" rx="360" ry="150" fill="none" stroke="#37d6e6" stroke-width="16" opacity="0.55"/>
    <circle cx="872" cy="512" r="26" fill="#37d6e6"/>
  </g>

  <!-- the wheel = the universal rideable symbol (skate, scooter, e-anything) -->
  <g filter="url(#soft)">
    <circle cx="512" cy="512" r="220" fill="url(#tire)"/>
    <circle cx="512" cy="512" r="220" fill="none" stroke="#00000030" stroke-width="10"/>
    <circle cx="512" cy="512" r="120" fill="url(#hub)"/>
    <!-- bearing bolts -->
    <g fill="#2b1c50">
      <circle cx="512" cy="512" r="34"/>
    </g>
    <g fill="#ffffffcc">
      <circle cx="512" cy="452" r="12"/>
      <circle cx="564" cy="542" r="12"/>
      <circle cx="460" cy="542" r="12"/>
    </g>
  </g>

  <!-- motion swoosh (roll + trick energy) -->
  <path d="M180 760 q 180 -70 360 -40 q 170 28 300 -70" fill="none" stroke="#c6ff42" stroke-width="20" stroke-linecap="round" opacity="0.9"/>
  <path d="M170 812 q 200 -60 380 -34 q 160 22 300 -54" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
</svg>
